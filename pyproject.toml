[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-procedural-agent"
version = "0.1.0"
description = "Self-learning real-time data agent on Google ADK 2.x with a procedural-memory knowledge graph"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.15,<3",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
llms = ["litellm>=1.80"]        # OpenAI, Azure OpenAI, TrueFoundry, Anthropic, Bedrock, Ollama ...
optimize = ["google-adk[eval]>=2.15,<3", "gepa"]
vertex = ["google-adk[extensions]>=2.15,<3"]
dev = ["pytest>=8", "litellm>=1.80"]

[tool.setuptools.packages.find]
include = ["procedural_agent", "procedural_agent.*"]

[tool.setuptools.package-data]
procedural_agent = ["prompts/*.md", "seed/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

